<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurum — Luxury 24K Gold Calculator</title>
<meta name="description" content="Premium gold price calculator with karat purity, weight conversion, and multi-currency support.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0806;--fg:#f5efe2;--muted:#a89a7d;--gold-1:#f7e7a1;--gold-2:#d4af37;--gold-3:#a07b27;--line:rgba(212,175,55,.18);--glass:rgba(255,255,255,.04);--gold-grad:linear-gradient(135deg,#f7e7a1 0%,#d4af37 45%,#a07b27 100%);--shadow-glow:0 0 40px rgba(212,175,55,.25),0 10px 50px rgba(0,0,0,.6);}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at top left,rgba(212,175,55,.10),transparent 50%),radial-gradient(ellipse at bottom right,rgba(201,139,107,.08),transparent 55%),var(--bg);color:var(--fg);font-family:'Inter',sans-serif;overflow-x:hidden}

  .aurum-page{min-height:100vh;min-height:100dvh;display:flex;align-items:safe center;justify-content:center;padding:2rem 1rem}
  .ambient{position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:.6}
  .ambient::before,.ambient::after{content:"";position:absolute;border-radius:50%;filter:blur(80px)}
  .ambient::before{top:10%;left:8%;width:380px;height:380px;background:rgba(212,175,55,.25)}
  .ambient::after{bottom:5%;right:8%;width:420px;height:420px;background:rgba(201,139,107,.22)}

  .card{position:relative;z-index:1;width:100%;max-width:980px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:28px;padding:2.5rem;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow-glow);overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-2),transparent);animation:shimmer 4s ease-in-out infinite}
  @keyframes shimmer{0%,100%{opacity:.3}50%{opacity:1}}

  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;gap:1rem;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:.85rem}
  .logo{width:46px;height:46px;border-radius:14px;background:var(--gold-grad);display:grid;place-items:center;box-shadow:0 0 24px rgba(212,175,55,.5);font-size:1.4rem;color:#1a1208}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.85rem;letter-spacing:.5px}
  .gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:2px}

  .live{display:flex;align-items:center;gap:.5rem;font-size:.72rem;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit}
  .live:hover{color:var(--fg)}
  .dot{width:8px;height:8px;border-radius:50%;background:#5fbf6f;box-shadow:0 0 8px #5fbf6f;animation:pulse 2s ease-in-out infinite}
  .dot.off{background:#bf6f5f;box-shadow:0 0 8px #bf6f5f}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .spin{display:inline-block;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .display{position:relative;background:#06050a;border:1px solid rgba(212,175,55,.2);border-radius:20px;padding:1.75rem 2rem;margin-bottom:2rem;box-shadow:inset 0 2px 30px rgba(0,0,0,.8);overflow:hidden}
  .display::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at top right,rgba(212,175,55,.12),transparent 60%);pointer-events:none}
  .display-head{display:flex;justify-content:space-between;font-size:.65rem;letter-spacing:.3em;color:rgba(212,175,55,.7);margin-bottom:1rem}
  .total{font-family:'JetBrains Mono',monospace;font-size:3.5rem;line-height:1;margin-bottom:1.25rem;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-all}
  .display-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
  .stat-label{font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:rgba(212,175,55,.6);margin-bottom:.25rem}
  .stat-val{font-family:'JetBrains Mono',monospace;font-size:1.05rem}

  .controls{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
  .field{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.25rem}
  .field-label{display:flex;align-items:center;gap:.5rem;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(212,175,55,.8);margin-bottom:.85rem}
  .weight-row{display:flex;gap:.5rem;align-items:center}
  .weight-input{flex:1;background:transparent;border:none;outline:none;font-family:'JetBrains Mono',monospace;font-size:1.5rem;color:var(--fg);min-width:0;width:100%}
  select{background:#1a1610;border:1px solid var(--line);border-radius:10px;padding:.4rem .7rem;color:var(--fg);font-family:inherit;font-size:.85rem;cursor:pointer}
  select:focus{outline:none;border-color:var(--gold-2)}

  .pill-row{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill{background:rgba(212,175,55,.06);border:1px solid var(--line);border-radius:10px;padding:.5rem .9rem;color:var(--fg);font-family:inherit;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .2s}
  .pill:hover{border-color:rgba(212,175,55,.4)}
  .pill.active{background:var(--gold-grad);color:#1a1208;border-color:transparent;box-shadow:0 0 18px rgba(212,175,55,.4)}

  .karat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
  .karat{background:rgba(212,175,55,.06);border:1px solid var(--line);border-radius:14px;padding:.7rem;cursor:pointer;text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--fg);transition:all .2s}
  .karat:hover{transform:scale(1.02);border-color:rgba(212,175,55,.4)}
  .karat.active{background:var(--gold-grad);color:#1a1208;border-color:transparent;box-shadow:0 0 18px rgba(212,175,55,.4)}
  .karat small{display:block;font-family:'Inter',sans-serif;font-size:.6rem;letter-spacing:.2em;opacity:.7;margin-top:2px}

  .conv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:center}
  .mini{background:#0e0b08;border:1px solid var(--line);border-radius:10px;padding:.55rem .3rem}
  .mini-val{font-family:'JetBrains Mono',monospace;font-size:.92rem;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mini-lbl{font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:2px}

  .footer{margin-top:1.75rem;padding-top:1.25rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;font-size:.72rem;color:var(--muted)}
  .footer .brand-mark{letter-spacing:.25em;text-transform:uppercase}

  @media (max-width:720px){
    .aurum-page{padding:.5rem .4rem;align-items:flex-start}
    .card{padding:.85rem;border-radius:16px;max-width:100%;width:100%}
    .display{padding:.9rem .75rem;margin-bottom:1rem}
    .total{font-size:1.55rem;margin-bottom:.85rem;word-break:break-word;overflow-wrap:anywhere}
    .controls{grid-template-columns:1fr;gap:.85rem}
    .display-grid{grid-template-columns:1fr 1fr;gap:.5rem}
    h1{font-size:1.2rem}
    .header{margin-bottom:1rem}
    .field{padding:.75rem .85rem}
    .karat-grid{grid-template-columns:repeat(3,1fr);gap:.35rem}
    .karat{padding:.5rem .2rem;font-size:.95rem}
    .conv-grid{grid-template-columns:repeat(3,1fr);gap:.35rem}
    .mini-val{font-size:.72rem}
    .pill-row{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem}
    .pill{padding:.45rem .2rem;font-size:.7rem;flex:none;min-width:0;text-align:center}
    .weight-input{font-size:1.15rem}
    select{font-size:.75rem;padding:.35rem .45rem}
    .logo{width:38px;height:38px;font-size:1.15rem}
  }
  @media (max-width:380px){
    .total{font-size:1.3rem}
    .karat-grid{grid-template-columns:repeat(3,1fr)}
    .stat-val{font-size:.88rem}
  }
</style>
</head>
<body>
<div class="aurum-page">
  <div class="ambient" aria-hidden="true"></div>
  <main class="card">
    <header class="header">
      <div class="brand">
        <div class="logo">⚜</div>
        <div>
          <h1><span class="gold-text">Aurum</span> Calculator</h1>
          <div class="tag">Luxury Bullion Suite</div>
        </div>
      </div>
      <button class="live" id="liveBtn" title="Refresh price">
        <span class="dot off" id="dot"></span>
        <span id="statusText">Offline · —</span>
        <span id="spin">↻</span>
      </button>
    </header>

    <section class="display">
      <div class="display-head">
        <span id="karatLabel">24K GOLD PRICE</span>
        <span>↑ LIVE SPOT</span>
      </div>
      <div class="total" id="total">$0.00</div>
      <div class="display-grid">
        <div><div class="stat-label">Weight</div><div class="stat-val" id="weightGram">0.000 g</div></div>
        <div><div class="stat-label">In Ounces</div><div class="stat-val" id="weightOz">0.0000 oz</div></div>
        <div><div class="stat-label">Per Gram</div><div class="stat-val" id="perGram">$0.00</div></div>
      </div>
    </section>

    <div class="controls">
      <div>
        <div class="field" style="margin-bottom:1rem">
          <div class="field-label">⚖ Weight</div>
          <div class="weight-row">
            <input class="weight-input" id="weight" value="10" inputmode="decimal" placeholder="0.00">
            <select id="unit">
              <option value="gram">Gram</option>
              <option value="ounce">Troy Ounce</option>
              <option value="tola">Tola</option>
              <option value="kilo">Kilogram</option>
            </select>
          </div>
        </div>
        <div class="field">
          <div class="field-label">💴 Currency</div>
          <div class="pill-row" id="currencyRow"></div>
        </div>
      </div>
      <div>
        <div class="field" style="margin-bottom:1rem">
          <div class="field-label">✦ Karat Purity</div>
          <div class="karat-grid" id="karatGrid"></div>
        </div>
        <div class="field">
          <div class="field-label">⇅ Conversions</div>
          <div class="conv-grid">
            <div class="mini"><div class="mini-val" id="convGram">0.00</div><div class="mini-lbl">Grams</div></div>
            <div class="mini"><div class="mini-val" id="convOz">0.000</div><div class="mini-lbl">Ounces</div></div>
            <div class="mini"><div class="mini-val" id="convTola">0.000</div><div class="mini-lbl">Tola</div></div>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <span id="spot">Spot · $2,847.65 / oz (fallback)</span>
      <span class="brand-mark">Crafted in 24K · Aurum™</span>
    </footer>
  </main>
</div>

<script>
  const FALLBACK=2847.65, REFRESH_MS=60000, OZ_PER_GRAM=1/31.1034768, TOLA_PER_GRAM=1/11.6638038;
  const UNITS={gram:{toGram:1},ounce:{toGram:31.1034768},tola:{toGram:11.6638038},kilo:{toGram:1000}};
  const CURRENCIES=[{id:"USD",sym:"$",rate:1},{id:"EUR",sym:"€",rate:.92},{id:"GBP",sym:"£",rate:.79},{id:"AED",sym:"د.إ",rate:3.67},{id:"INR",sym:"₹",rate:83.2}];
  const KARATS=[24,22,21,18,14,10];

  const $=id=>document.getElementById(id);
  const fmt=(n,sym)=>sym+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

  let state={weight:"10",unit:"gram",karat:24,currency:"USD",price:FALLBACK,isLive:false,spinning:false,now:"—"};

  function render(){
    const cur=CURRENCIES.find(c=>c.id===state.currency);
    const w=parseFloat(state.weight)||0;
    const grams=w*UNITS[state.unit].toGram;
    const pricePerGramUsd=state.price*OZ_PER_GRAM*(state.karat/24);
    const totalUsd=grams*pricePerGramUsd;

    $("total").textContent=fmt(totalUsd*cur.rate,cur.sym);
    $("weightGram").textContent=grams.toFixed(3)+" g";
    $("weightOz").textContent=(grams*OZ_PER_GRAM).toFixed(4)+" oz";
    $("perGram").textContent=fmt(pricePerGramUsd*cur.rate,cur.sym);
    $("karatLabel").textContent=state.karat+"K GOLD PRICE";
    $("convGram").textContent=grams.toFixed(2);
    $("convOz").textContent=(grams*OZ_PER_GRAM).toFixed(3);
    $("convTola").textContent=(grams*TOLA_PER_GRAM).toFixed(3);
    $("spot").textContent="Spot · "+fmt(state.price,"$")+" / oz"+(state.isLive?"":" (fallback)");
    $("statusText").textContent=(state.isLive?"Live":"Offline")+" · "+state.now;
    $("dot").className="dot"+(state.isLive?"":" off");
    $("spin").className=state.spinning?"spin":"";

    document.querySelectorAll(".pill").forEach(p=>p.classList.toggle("active",p.dataset.id===state.currency));
    document.querySelectorAll(".karat").forEach(k=>k.classList.toggle("active",+k.dataset.k===state.karat));
  }

  function buildControls(){
    const cr=$("currencyRow");
    cr.innerHTML="";
    CURRENCIES.forEach(c=>{
      const b=document.createElement("button");
      b.className="pill";b.dataset.id=c.id;b.textContent=c.id;
      b.onclick=()=>{state.currency=c.id;render();};
      cr.appendChild(b);
    });
    const kg=$("karatGrid");
    kg.innerHTML="";
    KARATS.forEach(k=>{
      const b=document.createElement("button");
      b.className="karat";b.dataset.k=k;b.innerHTML=k+"K<small>"+((k/24)*100).toFixed(1)+"%</small>";
      b.onclick=()=>{state.karat=k;render();};
      kg.appendChild(b);
    });
  }

  async function fetchPrice(){
    state.spinning=true;render();
    try{
      const res=await fetch("https://api.gold-api.com/price/XAU",{headers:{accept:"application/json"}});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const j=await res.json();
      if(typeof j.price==="number"){state.price=j.price;state.isLive=true;}
    }catch(e){state.isLive=false;console.warn("Gold price fetch failed",e);}
    finally{state.spinning=false;state.now=new Date().toLocaleTimeString();render();}
  }

  $("weight").addEventListener("input",e=>{state.weight=e.target.value.replace(/[^0-9.]/g,"");render();});
  $("unit").addEventListener("change",e=>{state.unit=e.target.value;render();});
  $("liveBtn").addEventListener("click",fetchPrice);

  buildControls();
  fetchPrice();
  setInterval(fetchPrice,REFRESH_MS);
  render();
</script>
</body>
</html>
